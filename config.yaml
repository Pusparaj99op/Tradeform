mt5:
  # Your MT5 account credentials
  login: 24645008            # Your MT5 account number (integer)
  password: "slmi%H!0"        # Your MT5 account password
  server: "VantageInternational-Demo"          # Broker server name (e.g., "ICMarkets-Demo")
  path: ""            # Optional: path to terminal64.exe

ollama:
  host: "http://localhost:11434"
  model: "qwen3.5:9b"           # Which Ollama model to use
  temperature: 0.15           # Very low = razor-sharp scalping decisions
  analysis_interval_minutes: 1  # 1-minute scalping cycles

trading:
  symbols:
    - "BTCUSD"               # GOLD only — pure scalping focus
  timeframe: "M15"              # M1 for scalping
  mode: "auto"          # "auto" = full autonomous execution

risk:
  max_risk_per_trade_pct: 1.5   # 1.5% per scalp — tight risk
  max_daily_drawdown_pct: 5.0   # Halt after 5% daily loss
  max_positions: 5              # Up to 5 gold scalps at once
  max_lot_size: 1.0             # Gold has high pip value, cap at 1 lot
  default_sl_atr_multiplier: 1.0  # Tight SL = 1x ATR for scalping
  default_tp_atr_multiplier: 2.0  # TP = 2x ATR — quick 1:2 RR scalps


